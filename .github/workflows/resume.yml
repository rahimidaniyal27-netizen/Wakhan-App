name: Package 028 resume
on:
  push:
    branches: [codex/resume-028]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q repair
        env:
          PYTHONPYCACHEPREFIX: /tmp/wakhan-resume-pycache
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-028-Resume
          path: repair/
          if-no-files-found: error
          retention-days: 14
