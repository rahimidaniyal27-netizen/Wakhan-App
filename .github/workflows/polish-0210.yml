name: Wakhan 0.2.10 room and chat build
on:
  workflow_dispatch:
  push:
    branches: [codex/polish-0.2.10]
permissions:
  contents: read
concurrency:
  group: wakhan-royal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash ios-assets/build-ios.sh
      - run: python3 server-update0210/build-upgrade.py
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-Consolidated-0.2.10-beta
          path: delivery0210/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-iOS-0.2.10-beta
          path: |
            Wakhan-0.2.10-beta.ipa
            ios-build-result.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Wakhan-0210-iOS-log
          path: ios-build.log
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm run prepare:web
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug -q
