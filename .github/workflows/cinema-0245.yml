name: Wakhan Cinema rebuilt from scratch 0.2.45
on:
  push:
    branches: [codex/cinema-0245]
    paths: [.github/workflows/cinema-0245.yml, cinema0245/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinema-0245-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify current source and unpack
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('cinema0245/Wakhan-0.2.45-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='0a4e400e09ad5a88fb297574a549970bfacbe66c1da596a8f3bf93df6e265030'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall('input245')
          m=json.loads(Path('input245/source-verification.json').read_text())
          for name,digest in m['source_sha256'].items():
              assert hashlib.sha256((Path('input245/project')/name).read_bytes()).hexdigest()==digest,name
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current iPhone client
        working-directory: input245/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          bash ios-assets/build-ios.sh
          python3 - <<'PY'
          import hashlib,json,plistlib,zipfile
          from pathlib import Path
          p=Path('Wakhan-0.2.45-beta.ipa')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              info=next(n for n in z.namelist() if n.count('/')==2 and n.endswith('.app/Info.plist'))
              v=plistlib.loads(z.read(info))
              assert v['CFBundleIdentifier']=='app.wakhan.music'
              assert v['CFBundleShortVersionString']=='0.2.45' and str(v['CFBundleVersion'])=='60'
              base=info.rsplit('/',1)[0]
              binary=z.read(base+'/'+v['CFBundleExecutable'])
              for marker in (b'safeArea:',b'orientation:',b'wakhanKeyboardFrame',b'supportedInterfaceOrientations'):assert marker in binary,marker
              assert {'UIInterfaceOrientationPortrait','UIInterfaceOrientationLandscapeLeft','UIInterfaceOrientationLandscapeRight'}<=set(v['UISupportedInterfaceOrientations'])
              assert hashlib.sha256(z.read(base+'/public/wakhan-shell.json')).hexdigest()=='908a3d140aa4a3029b2b9a7916020e2449c075e9170cb5ef22bb3aa406b874ef'
              assert 'hc-wallet-coin-turn 3s' in z.read(base+'/public/home-ui/src/native-home.css').decode()
              js=b''.join(z.read(n) for n in z.namelist() if n.startswith(base+'/public/assets/index-') and n.endswith('.js'))
              for filename in ('app.js','bridge.js','voice.js','renderers/world.js','renderers/cards.js','renderers/ludo.js','renderers/chess.js'):
                  assert z.read(base+'/public/games-ui/'+filename)==Path('public/games-ui/'+filename).read_bytes()
              assert b'wk-shared-nav' in js and b'/api/app/home/rankings' in js and b'wakhan-games-v1' in js and b'wakhan-music-v1' in js
          Path('ios-build-result.json').write_text(json.dumps({'version':'0.2.45-beta','build':60,'signed':False,'installation':'Sideloadly','device_verified':False,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-iPhone-0.2.45-build60
          path: |
            input245/project/Wakhan-0.2.45-beta.ipa
            input245/project/ios-build-result.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Wakhan-iPhone-0239-build-log
          path: /tmp/xb.log
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify current source and unpack
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('cinema0245/Wakhan-0.2.45-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='0a4e400e09ad5a88fb297574a549970bfacbe66c1da596a8f3bf93df6e265030'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall('input245')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build Android without exporting the owner's signing key
        working-directory: input245/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          npm run build
          npx cap sync android
          gradle -p android --no-daemon --refresh-dependencies :app:assembleRelease :app:bundleRelease -q || {
            sleep 3
            gradle -p android --no-daemon --refresh-dependencies :app:assembleRelease :app:bundleRelease -q
          }
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=Path('android/app/build/outputs/apk/release/app-release-unsigned.apk')
          aab=Path('android/app/build/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              js=b''.join(z.read(n) for n in z.namelist() if n.startswith('assets/public/assets/index-') and n.endswith('.js'))
              assert b'wk-shared-nav' in js and b'/api/app/home/rankings' in js and b'wakhan-games-v1' in js and b'wakhan-music-v1' in js
              assert z.read('assets/public/games-ui/renderers/world.js')==Path('public/games-ui/renderers/world.js').read_bytes()
              assert hashlib.sha256(z.read('assets/public/wakhan-shell.json')).hexdigest()=='908a3d140aa4a3029b2b9a7916020e2449c075e9170cb5ef22bb3aa406b874ef'
          Path('android-build-result.json').write_text(json.dumps({'version':'0.2.45-beta','build':60,'signed':False,'needs_original_server_signing':True,'device_verified':False,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'aab_sha256':hashlib.sha256(aab.read_bytes()).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-Android-0.2.45-build60-unsigned
          path: |
            input245/project/android/app/build/outputs/apk/release/app-release-unsigned.apk
            input245/project/android/app/build/outputs/bundle/release/app-release.aab
            input245/project/android-build-result.json
          if-no-files-found: error
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install aiohttp pillow
          python -m zipfile -e cinema0245/Wakhan-0.2.45-source.zip backend245
          python -m unittest discover -s backend245/server-tests -v

  bootstrap:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python -m pip install aiohttp pillow playwright==1.62.0 --quiet
          command -v ffmpeg || (apt-get update -qq && apt-get install -y -qq ffmpeg)
          python -m zipfile -e cinema0245/Wakhan-0.2.45-source.zip browser245
          cd browser245/project
          npm ci --no-audit --no-fund --loglevel=error
          npm run dev -- --port 5181 > /tmp/wakhan-vite.log 2>&1 &
          cd ../..
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5181/ > /dev/null; then break; fi
            sleep 1
          done
          WK_REVIEW_BASE=http://127.0.0.1:5181 python browser245/review/check_new_boot.py --both
          python browser245/review/real_cinema_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wakhan-Cinema-0.2.45-browser-tests
          path: |
            browser245/review/new-bootstrap-results.json
            browser245/review/real-cinema-browser.json
            browser245/review/*.png
          if-no-files-found: ignore
