name: iOS build (unsigned IPA for Sideloadly)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash ios-assets/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-iOS
          path: Wakhan-*.ipa
          retention-days: 14
