name: Wakhan 0.2.77 native build (iPhone + Android)
on:
  push:
    branches: [wakhan-0.2.77]
    paths: [.github/workflows/build-0277.yml, delivery0277/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-0277-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and unpack exact reviewed source
        run: python3 delivery0277/verify-source.py
      - name: Test and compile iPhone
        working-directory: input277/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          bash ios-assets/build-ios.sh
          python3 ../../delivery0277/verify-native.py ios
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-iPhone-0.2.77-build92
          path: |
            input277/project/Wakhan-0.2.77-beta.ipa
            input277/project/ios-build-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wakhan-iPhone-build92-diagnostics
          path: /tmp/xb.log
          if-no-files-found: ignore
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify and unpack exact reviewed source
        run: python3 delivery0277/verify-source.py
      - name: Test and compile Android
        working-directory: input277/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          npm run build
          npx cap sync android
          gradle -p android --no-daemon :app:assembleRelease -q
          python3 ../../delivery0277/verify-native.py android
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-Android-0.2.77-build92-for-server-signing
          path: |
            input277/project/Wakhan-0.2.77-unsigned.apk
            input277/project/android-build-result.json
          if-no-files-found: error
          retention-days: 30
