name: Package matching Wakhan build94 owner update
on:
  push:
    branches: [wakhan-0.2.79]
    paths: [release0279/**, .github/workflows/package-build94.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for verified native pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,time
          for _ in range(100):
            run=json.loads(subprocess.check_output(['gh','api','repos/${{ github.repository }}/actions/runs/45951776248']))
            if run['status']=='completed':
              assert run['conclusion']=='success','Native build failed'
              break
            time.sleep(10)
          else:raise RuntimeError('Native build still pending')
          PYCODE
      - name: Download exact native outputs and package reviewed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-0.2.79-beta --pattern 'Wakhan-0.2.79-unsigned.apk' --pattern 'Wakhan-0.2.79-beta.ipa' --pattern '*-build-result.json' --dir release0279/server-package
          python3 release0279/package.py
      - name: Deliver owner update archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload native-0.2.79-beta release0279/Wakhan-0.2.79-iPhone-Android.zip release0279/SHA256SUMS.txt
