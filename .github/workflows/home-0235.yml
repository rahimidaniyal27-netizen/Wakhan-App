name: Wakhan Home 0.2.35
on:
  push:
    branches: [codex/home-0235]
    paths: [.github/workflows/home-0235.yml, home0235/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-0235-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify current source and unpack
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('home0235/Wakhan-0.2.35-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='97561a69975c048687c048a5bd4be10b2f75c973e582642af34ac0910f5df5a0'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall('input235')
          m=json.loads(Path('input235/source-verification.json').read_text())
          for name,digest in m['source_sha256'].items():
              assert hashlib.sha256((Path('input235/project')/name).read_bytes()).hexdigest()==digest,name
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current iPhone client
        working-directory: input235/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          bash ios-assets/build-ios.sh
          python3 - <<'PY'
          import hashlib,json,plistlib,zipfile
          from pathlib import Path
          p=Path('Wakhan-0.2.35-beta.ipa')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              info=next(n for n in z.namelist() if n.count('/')==2 and n.endswith('.app/Info.plist'))
              v=plistlib.loads(z.read(info))
              assert v['CFBundleIdentifier']=='app.wakhan.music'
              assert v['CFBundleShortVersionString']=='0.2.35' and str(v['CFBundleVersion'])=='50'
              base=info.rsplit('/',1)[0]
              assert hashlib.sha256(z.read(base+'/public/wakhan-shell.json')).hexdigest()=='6aa00eb8134dffd47e394005be1b50d2d8087aef0960d41d9dae5a96fa72a30d'
              assert 'hc-wallet-coin-turn 3s' in z.read(base+'/public/home-ui/src/native-home.css').decode()
          Path('ios-build-result.json').write_text(json.dumps({'version':'0.2.35-beta','build':50,'signed':False,'installation':'Sideloadly','device_verified':False,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-iPhone-0.2.35-build50
          path: |
            input235/project/Wakhan-0.2.35-beta.ipa
            input235/project/ios-build-result.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Wakhan-iPhone-0235-build-log
          path: /tmp/xb.log
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify current source and unpack
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('home0235/Wakhan-0.2.35-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='97561a69975c048687c048a5bd4be10b2f75c973e582642af34ac0910f5df5a0'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall('input235')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: android-actions/setup-android@v3
      - name: Build Android without exporting the owner's signing key
        working-directory: input235/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          npm run build
          npx cap sync android
          gradle -p android --no-daemon :app:assembleRelease :app:bundleRelease -q
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=Path('android/app/build/outputs/apk/release/app-release-unsigned.apk')
          aab=Path('android/app/build/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('assets/public/wakhan-shell.json')).hexdigest()=='6aa00eb8134dffd47e394005be1b50d2d8087aef0960d41d9dae5a96fa72a30d'
          Path('android-build-result.json').write_text(json.dumps({'version':'0.2.35-beta','build':50,'signed':False,'needs_original_server_signing':True,'device_verified':False,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'aab_sha256':hashlib.sha256(aab.read_bytes()).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-Android-0.2.35-build50-unsigned
          path: |
            input235/project/android/app/build/outputs/apk/release/app-release-unsigned.apk
            input235/project/android/app/build/outputs/bundle/release/app-release.aab
            input235/project/android-build-result.json
          if-no-files-found: error
          retention-days: 14
