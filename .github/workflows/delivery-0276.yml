name: Wakhan 0.2.76 salon liquid dock (iPhone)
on:
  push:
    branches: [wakhan-0.2.76]
    paths: [.github/workflows/delivery-0276.yml, delivery0276/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: delivery-0276-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and unpack
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('delivery0276/Wakhan-0.2.76-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='c4c01be43d4eea1efb89726f30227b871d112cbc29d67796846d265f481cb33c'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall('input250')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build iPhone client
        working-directory: input250/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          bash ios-assets/build-ios.sh
          python3 - <<'PY'
          import hashlib,json,plistlib,zipfile
          from pathlib import Path
          p=Path('Wakhan-0.2.76-beta.ipa')
          shell=hashlib.sha256(Path('public/wakhan-shell.json').read_bytes()).hexdigest()
          assert shell=='10af1edd1857eeea47d38388e8f769b592f0f21e45856fb2ccda8d05d5531ed0'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              info=next(n for n in z.namelist() if n.count('/')==2 and n.endswith('.app/Info.plist'))
              v=plistlib.loads(z.read(info))
              assert v['CFBundleIdentifier']=='app.wakhan.music'
              assert v['CFBundleShortVersionString']=='0.2.76' and str(v['CFBundleVersion'])=='91'
              base=info.rsplit('/',1)[0]
              binary=z.read(base+'/'+v['CFBundleExecutable'])
              for marker in (b'safeArea:',b'orientation:',b'wakhanKeyboardFrame',b'supportedInterfaceOrientations'):assert marker in binary,marker
              assert hashlib.sha256(z.read(base+'/public/wakhan-shell.json')).hexdigest()==shell
              b=json.loads(z.read(base+'/public/wakhan-shell.json'))
              slr3=next(x['code'] for x in b['programs'] if x['id']=='slr3.js')
              assert 'r-lq' in slr3 and 'micBusy' in slr3 and 'await vcMute()' in slr3 and '[dir=ltr].slr .r-hd{flex-direction:row-reverse}' in slr3 and 'function isNat(c){if(' in slr3
              sln3=next(x['code'] for x in b['programs'] if x['id']=='sln3.js'); assert 'ytdock' in sln3 and 'ydMini' in sln3
              js=b''.join(z.read(n) for n in z.namelist() if n.startswith(base+'/public/assets/index-') and n.endswith('.js'))
              assert b'https://music.kabulcafe.uk' in js and b'2.31.72.140' not in js
          Path('ios-build-result.json').write_text(json.dumps({'version':'0.2.76-beta','build':91,'signed':False,'installation':'Sideloadly','sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-iPhone-0.2.76-build91
          path: |
            input250/project/Wakhan-0.2.76-beta.ipa
            input250/project/ios-build-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish the IPA as a release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=input250/project/Wakhan-0.2.76-beta.ipa
          gh release delete "ios-0.2.76-beta" --yes --cleanup-tag 2>/dev/null || true
          gh release create "ios-0.2.76-beta" "$F" --target "$GITHUB_SHA" --prerelease --title "Wakhan 0.2.76 (iPhone, for Sideloadly)" --notes "Chat opens at once (saved on the phone like Telegram), live picture and music look in the small salon card, round card option, SoundCloud stop is instant"
