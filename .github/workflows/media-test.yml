name: wakhan media engine tests
on:
  push:
    branches: [media-engine]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q aiohttp pytest
      - run: python -m pytest -q -x media_tests 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        shell: bash
