name: wakhan media engine tests
on:
  push:
    branches: [media-engine]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q aiohttp pytest
      - run: python -m pytest -q -x media_tests 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        shell: bash
  wheels:
    runs-on: ubuntu-latest
    steps:
      - run: "pip download -q -d w --only-binary=:all: --python-version 3.13 --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 aiohttp"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: w
