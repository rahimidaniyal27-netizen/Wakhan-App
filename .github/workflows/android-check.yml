name: Android check (build only)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug -q
