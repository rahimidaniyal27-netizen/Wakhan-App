name: Wakhan Android Home 0.2.35
on:
  push:
    branches: [codex/home-0235]
    paths: [.github/workflows/home-0235-android.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify current source and unpack
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('home0235/Wakhan-0.2.35-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='97561a69975c048687c048a5bd4be10b2f75c973e582642af34ac0910f5df5a0'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall('input235')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build Android without exporting the owner's signing key
        working-directory: input235/project
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm test
          npm run build
          npx cap sync android
          gradle -p android --no-daemon :app:assembleRelease :app:bundleRelease -q
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=Path('android/app/build/outputs/apk/release/app-release-unsigned.apk')
          aab=Path('android/app/build/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('assets/public/wakhan-shell.json')).hexdigest()=='6aa00eb8134dffd47e394005be1b50d2d8087aef0960d41d9dae5a96fa72a30d'
          Path('android-build-result.json').write_text(json.dumps({'version':'0.2.35-beta','build':50,'signed':False,'needs_original_server_signing':True,'device_verified':False,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'aab_sha256':hashlib.sha256(aab.read_bytes()).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-Android-0.2.35-build50-unsigned
          path: |
            input235/project/android/app/build/outputs/apk/release/app-release-unsigned.apk
            input235/project/android/app/build/outputs/bundle/release/app-release.aab
            input235/project/android-build-result.json
          if-no-files-found: error
          retention-days: 14
