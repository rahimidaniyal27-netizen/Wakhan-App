name: Wakhan unified music and regression fixes 0.2.42 verified delivery
on:
  push:
    branches: [codex/music-0242]
    paths: [.github/workflows/delivery-0242.yml, delivery0242/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Wakhan-iPhone-0.2.42-build57
          path: ios242
          run-id: 44294334077
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Wakhan-Android-0.2.42-build57-unsigned
          path: android242
          run-id: 44294334077
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Wakhan-bootstrap-0.2.42-build57
          path: bootstrap242
          run-id: 44294334077
          github-token: ${{ github.token }}
      - name: Assemble and verify source, native assets and guarded installer
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil,subprocess,sys,zipfile
          from pathlib import Path
          out=Path('release242');out.mkdir()
          inp=Path('delivery0242/delivery-input.zip')
          assert hashlib.sha256(inp.read_bytes()).hexdigest()=='ed147a57babedf43629c68edcd73022f73585f3c1eca1ca6181036df01e53f77'
          with zipfile.ZipFile(inp) as z:
              assert z.testzip() is None
              z.extractall(out)
          for name,folder in [('Wakhan-0.2.42-beta.ipa','ios242'),('app-release-unsigned.apk','android242'),('app-release.aab','android242')]:
              paths=list(Path(folder).rglob(name));assert len(paths)==1,(name,paths)
              shutil.copy2(paths[0],out/name)
          shutil.copy2('music0242/Wakhan-0.2.42-source.zip',out/'Wakhan-0.2.42-source.zip')
          assert hashlib.sha256((out/'Wakhan-0.2.42-source.zip').read_bytes()).hexdigest()=='850cf01861ce0211eaeb52ae3ff8a10723353d39b8549345489d214bfa3ad6e3'
          subprocess.run([sys.executable,str(out/'verify-native.py'),str(out)],check=True)
          compile((out/'sign-and-publish.py').read_text(),'sign-and-publish.py','exec')
          evidence=list(Path('bootstrap242').rglob('bootstrap-results.json'));assert len(evidence)==1
          browser=json.loads(evidence[0].read_text());assert {x['engine'] for x in browser}=={'chromium','webkit'}
          assert all(x['full_bootstrap'] and x['intro_removed'] and x['no_mutation_loop'] and not x['errors'] and x['salon']['media']['fifo'] and x['salon']['media']['empty_queue_repeats'] for x in browser)
          assert all(x['sources']['duplicate_ended_advanced_once'] and x['room']['latest_after_delayed_image'] for x in browser)
          assert all(x['offline']['cold_start_without_server'] and x['offline']['other_account_excluded'] for x in browser)
          shutil.copy2(evidence[0],out/'review/ci-bootstrap-results.json')
          for image in Path('bootstrap242').rglob('*.png'):shutil.copy2(image,out/'review'/('ci-'+image.name))

          with zipfile.ZipFile(out/'Wakhan-0.2.42-source.zip') as z:assert z.read('source-verification.json')==(out/'source-verification.json').read_bytes()
          source=json.loads((out/'source-verification.json').read_text())
          assert source['version']=='0.2.42-beta' and source['build']==57
          manifest=dict(version='0.2.42-beta',build=57,server_update_required=True,physical_device_verified=False,installer_revision='0242-current041-backend-transaction-preserve-local-build-files',base_version='0.2.41-beta',base_build=56,build_run=44294334077,source_commit='c8d70e51763c63efdff3347e71d2d35dfdbefe5d',sha256={p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='PACKAGE.json'})
          (out/'PACKAGE.json').write_text(json.dumps(manifest,indent=2))
          for name,digest in manifest['sha256'].items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest,name
          print('VERIFIED build57: exact reviewed public assets, native download plugins, current build56 baseline, guarded signer and installer.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wakhan-0.2.42-iPhone-Android
          path: release242/
          if-no-files-found: error
          retention-days: 14
