const wpOriginalApi=api;
api=async function(path,body){
 const j=await wpOriginalApi(path,body);
 if(path==='/api/me'&&j.ok&&j.entitlement){WP.entitlement=j.entitlement;WP.lastStatus=Date.now()}
 if(j.err==='subscription_required'){
  WP.entitlement={allowed:false};wpStopPersonal();
  if(TAB==='p'||TAB==='c')queueMicrotask(()=>render());
 }
 return j;
};
function wpAllowed(){return !!(WP.entitlement||ME?.entitlement)?.allowed}
function wpMoney(value,currency){
 const n=Number(value)*(currency==='irt'?10:1);if(!Number.isFinite(n))return '—';
 if(currency==='irt')currency='irr';
 const max=currency==='irr'||currency==='irt'?0:currency==='ton'?6:currency==='usdt'?4:2;
 return `<bdi dir="ltr">${h(new Intl.NumberFormat('en-US',{maximumFractionDigits:max}).format(n))} ${h(wpT(currency))}</bdi>`;
}

async function wpStatus(){
 if(WP.statusBusy)return WP.statusBusy;
 WP.statusBusy=(async()=>{try{
  const j=await api('/api/personal?status=1');
  if(j.ok){const previous=wpAllowed();WP.entitlement=j.entitlement;if(ME)ME.entitlement=j.entitlement;WP.lastStatus=Date.now();
   if(WP.catalog&&j.trial)WP.catalog.trial=j.trial;
   if(!j.entitlement.allowed)wpStopPersonal();
   if(previous!==j.entitlement.allowed&&(TAB==='p'||TAB==='c'||TAB==='s'))render();
  }return j;
 }catch(e){return {ok:false}}finally{WP.statusBusy=null}})();
 return WP.statusBusy;
}
async function wpLoadCatalog(){

 try{
  const j=await api('/api/personal'+(WP.currency?'?display='+encodeURIComponent(WP.currency):''));
  if(seq!==WP.seq)return;
  if(j.ok){WP.catalog=j;WP.entitlement=j.entitlement;if(ME)ME.entitlement=j.entitlement;WP.lastStatus=Date.now()}
  else WP.error=wpT(j.err);

}

// Normalize rendered UI only. Do not alter scripts, CSS, user input or callback data.
function wpLatinTree(root){
 if(!root)return;
 if(root.nodeType===3){const parent=root.parentElement;if(!parent||parent.closest('script,style,textarea,[contenteditable="true"]'))return;const value=wpDigits(root.nodeValue);if(value!==root.nodeValue)root.nodeValue=value;return}
 if(root.nodeType!==1)return;
 if(root.matches('script,style,textarea,[contenteditable="true"]'))return;
 for(const key of ['placeholder','aria-label','title']){const before=root.getAttribute(key);if(before!==null){const after=wpDigits(before);if(after!==before)root.setAttribute(key,after)}}
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
 while((node=walker.nextNode()))wpLatinTree(node);
 root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(element=>{for(const key of ['placeholder','aria-label','title']){const before=element.getAttribute(key);if(before!==null){const after=wpDigits(before);if(before!==after)element.setAttribute(key,after)}}});
}
let wpDigitQueued=false;const wpDigitRoots=new Set();
const wpDigitObserver=new MutationObserver(records=>{
 for(const record of records){if(record.type==='characterData')wpDigitRoots.add(record.target);else if(record.type==='attributes')wpDigitRoots.add(record.target);else for(const node of record.addedNodes)wpDigitRoots.add(node)}
 if(wpDigitQueued)return;wpDigitQueued=true;
 queueMicrotask(()=>{wpDigitQueued=false;const roots=[...wpDigitRoots];wpDigitRoots.clear();roots.forEach(wpLatinTree)});
});
wpDigitObserver.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
wpLatinTree(document.body);

 let panel=document.getElementById('wm-finance-panel');if(!panel){panel=document.createElement('section');panel.id='wm-finance-panel';panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');document.body.appendChild(panel)}
 panel.innerHTML=`<div class="wf-panel-head"><b>${ae('🧾')} ${h(wfT('title'))}</b><button class="ib" onclick="wfClose()" aria-label="${h(wfT('close'))}">×</button></div><div class="wf-panel-body">${content}</div>`;
}
async function wfOpen(){if(!WF.summary?.allowed)return;WF.open=true;await wfLoad()}
function wfMoney(order){
 if(order.amount_label){const match=String(order.amount_label).match(/^\d+(?:\.\d+)?/);return match?wpMoney(match[0],order.cur):h(order.amount_label)}
 return wpMoney(order.amount,order.cur);
}
function wfOrder(order){
 const can=order.can_review&&order.buyer.id!==ME?.me?.id||order.can_review&&WF.summary?.owner;
 const photo=order.has_photo?`<button class="chip" onclick="wfPhoto('${order.kind}',${order.id},this)">${h(wfT('photo'))}</button><div class="wf-photo-slot"></div>`:'';
 return `<article class="wf-order"><div class="wf-order-top"><span><b>${h(order.buyer.name)}</b><small><bdi>${order.buyer.id}</bdi> · ${h(wfT(order.kind))} #${order.id}</small></span><span class="wf-status wf-${order.status}">${h(wfT(order.status))}</span></div><div class="wf-order-amount">${wfMoney(order)} <small>${order.months} ${h(wfT('month'))}</small></div>${order.group?`<p>${h(order.group.title)}</p>`:''}${order.method?`<p>${h(wfT(order.method))}</p>`:''}${order.reference?`<p>${h(wfT('reference'))}: <bdi>${h(order.reference)}</bdi></p>`:''}${order.proof?`<details><summary>${h(wfT('receipt'))}</summary><blockquote>${h(order.proof)}</blockquote></details>`:''}${photo}${can?`<p class="wf-bank-note">${h(wfT('bankWarn'))}</p><div class="wf-actions"><button class="wf-approve" onclick="wfReview('${order.kind}',${order.id},'ok',this)">${h(wfT('approve'))}</button><button class="wf-reject" onclick="wfReview('${order.kind}',${order.id},'no',this)">${h(wfT('reject'))}</button></div>`:''}</article>`;
}
function wfDraw(){
 if(!WF.open)return;
 const orders=WF.filter==='pending'?WF.orders.filter(o=>o.status==='wait'):WF.orders;
 wfShell(`<div class="wf-tools"><button class="chip ${WF.filter==='all'?'on':''}" onclick="WF.filter='all';wfLoad()">${h(wfT('all'))}</button><button class="chip ${WF.filter==='pending'?'on':''}" onclick="WF.filter='pending';wfLoad()">${h(wfT('pending'))}</button><button class="chip" onclick="wfLoad()">↻ ${h(wfT('refresh'))}</button></div>${WF.summary?.owner?`<div class="wf-owner-tools"><button class="chip" onclick="wfStaff()">${h(wfT('staff'))}</button><button class="chip" onclick="wfReceivers()">${h(wfT('receivers'))}</button></div>`:''}${orders.length?orders.map(wfOrder).join(''):`<div class="empty">${h(wfT('empty'))}</div>`}${WF.next?`<button class="chip" onclick="wfLoad(false)">${h(wfT('more'))}</button>`:''}`);
}
async function wfLoad(reset=true){
 if(!WF.open)return;
 const seq=WF.loadSeq=(WF.loadSeq||0)+1,filter=WF.filter,scroll=document.getElementById('wm-finance-panel')?.scrollTop||0;
 if(reset)wfShell(`<div class="skel" style="height:130px"></div>`);
 try{
  const j=await api('/api/finance/orders?filter='+filter+(!reset&&WF.next?'&before='+WF.next:''));
  if(seq!==WF.loadSeq||!WF.open||!WF.summary?.allowed)return;
  if(!j.ok){if(j.err==='finance_forbidden')wfAccept({allowed:false});return toast(wfT(j.err))}
  if(reset&&WF.photo){URL.revokeObjectURL(WF.photo);WF.photo=null}
  WF.orders=reset?j.orders:WF.orders.concat(j.orders);WF.next=j.next_before;WF.cursor=reset?j.cursor:WF.cursor;wfDraw();
  if(!reset)document.getElementById('wm-finance-panel').scrollTop=scroll;
  if(reset&&filter==='all')await api('/api/finance/seen',{cursor:j.cursor});await wfRefresh();
 }catch(e){toast(wfT('err'))}
}
async function wfReview(kind,id,action,button){
 const card=button.closest('.wf-order');card?.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{const j=await api('/api/finance/review',{kind,id,action});if(!j.ok)toast(wfT(j.err));await wfLoad()}catch(e){toast(wfT('err'));card?.querySelectorAll('button').forEach(b=>b.disabled=false)}
}
async function wfPhoto(kind,id,button){
 button.disabled=true;
 try{
  const response=await fetch(`/api/finance/receipt/${kind}/${id}`,{headers:{'X-Init':INIT}});
  if(!response.ok)throw Error('receipt_unavailable');
  const blob=await response.blob();
  if(WF.photo){URL.revokeObjectURL(WF.photo);document.querySelectorAll('.wf-receipt-image').forEach(image=>image.remove())}
  WF.photo=URL.createObjectURL(blob);const image=document.createElement('img');image.className='wf-receipt-image';image.src=WF.photo;image.alt=wfT('receipt');button.nextElementSibling?.appendChild(image);
 }catch(e){toast(wfT('receipt_unavailable'))}finally{button.disabled=false}
}
async function wfStaff(){
 const j=await api('/api/finance/staff');if(!j.ok)return toast(wfT(j.err));
 wfShell(`<button class="chip" onclick="wfLoad()">‹ ${h(wfT('purchases'))}</button><h3>${h(wfT('staff'))}</h3><div class="wf-staff-list">${j.staff.map(s=>`<div class="wf-staff"><span>${h(s.name)} <bdi>${s.id}</bdi><small>${h(wfT(s.level))}</small></span><button class="chip" onclick="wfGrant(${s.id},'none')">${h(wfT('remove'))}</button></div>`).join('')}</div><h3>${h(wfT('newStaff'))}</h3><input id="wf-uid" inputmode="numeric" placeholder="${h(wfT('uid'))}"><select id="wf-level"><option value="view">${h(wfT('view'))}</option><option value="review">${h(wfT('review'))}</option></select><button class="gbtn" onclick="wfGrant(Number(document.getElementById('wf-uid').value),document.getElementById('wf-level').value)">${h(wfT('add'))}</button>`);
}
async function wfGrant(uid,level){if(!Number.isSafeInteger(uid)||uid<=0)return toast(wfT('err'));const j=await api('/api/finance/staff',{uid,level});if(!j.ok)return toast(wfT(j.err));await wfStaff()}
async function wfReceivers(){
 const j=await api('/api/finance/receivers');if(!j.ok)return toast(wfT(j.err));
 const bank=j.receivers.sepa||{},rev=j.receivers.revolut||{};
 wfShell(`<button class="chip" onclick="wfLoad()">‹ ${h(wfT('purchases'))}</button><h3>${h(wfT('receivers'))}</h3><section class="wf-receiver"><b>${h(wfT('sepa'))}</b><label>${h(wfT('name'))}<input id="wf-bank-name" value="${h(bank.name||'')}"></label><label>${h(wfT('iban'))}<input id="wf-iban" dir="ltr" value="${h(bank.iban||'')}"></label><label>${h(wfT('bic'))}<input id="wf-bic" dir="ltr" value="${h(bank.bic||'')}"></label><button class="gbtn" onclick="wfSaveReceiver('sepa')">${h(wfT('save'))}</button>${bank.iban?`<button class="chip" onclick="wfSaveReceiver('sepa',false)">${h(wfT('disable'))}</button>`:''}</section><section class="wf-receiver"><b>Revolut</b><label>${h(wfT('name'))}<input id="wf-rev-name" value="${h(rev.name||'')}"></label><label>${h(wfT('revtag'))}<input id="wf-revtag" dir="ltr" value="${h(rev.revtag||'')}"></label><button class="gbtn" onclick="wfSaveReceiver('revolut')">${h(wfT('save'))}</button>${rev.revtag?`<button class="chip" onclick="wfSaveReceiver('revolut',false)">${h(wfT('disable'))}</button>`:''}</section>`);
}
async function wfSaveReceiver(method,enabled=true){
 const value=id=>document.getElementById(id)?.value||'';
 const data=method==='sepa'?{name:value('wf-bank-name'),iban:value('wf-iban'),bic:value('wf-bic')}:{name:value('wf-rev-name'),revtag:value('wf-revtag')};
 if(!enabled)data.enabled=false;
 const j=await api('/api/finance/receivers',{method,data});if(!j.ok)return toast(wfT(j.err));
 if(WP.catalog)WP.catalog.manual_methods=['sepa','revolut'].map(code=>({code,configured:!!j.receivers?.[code],currency:'eur'}));
 toast(wfT('saved'));if(!enabled)await wfReceivers();
}

function wfManualOptions(){
 const methods=WP.catalog?.manual_methods?.filter(m=>m.configured)||[];
 if(!methods.length)return '';
 return `<div class="wf-manual-methods"><small>${h(wfT('manualTitle'))}</small>${methods.map(m=>`<button class="chip" ${WF.manualBusy?'disabled':''} onclick="wfPrepare('${m.code}')">${m.code==='revolut'?'Ⓡ':'🏦'} ${h(wfT(m.code))}</button>`).join('')}</div>`;
}
const wfBaseStarsMarkup=wpStarsMarkup;
wpStarsMarkup=function(){return wfBaseStarsMarkup()+wfManualOptions()};
async function wfPrepare(method){
 if(WF.manualBusy||!WP.months)return;WF.manualBusy=true;WF.manual=null;wpRenderShop();
 const months=WP.months,currency=WP.currency;
 try{
  const j=await api('/api/personal/manual',{months,method,lang:LG});
  if(months!==WP.months||currency!==WP.currency)return;
  if(!j.ok)return toast(wpT(j.err));WF.manual=j;wpRenderShop();
 }catch(e){toast(wfT('err'))}finally{WF.manualBusy=false;wpRenderShop()}
}
function wfManualMarkup(){
 const m=WF.manual;if(!m||!WP.months)return '';
 const details=m.method==='sepa'?`${m.receiver.name}\n${m.receiver.iban}${m.receiver.bic?'\n'+m.receiver.bic:''}`:`${m.receiver.name}\n${m.receiver.revtag}`;
 return `<section class="card wf-customer-transfer"><h3>${h(wfT(m.method))}</h3><strong>${wpMoney(m.amount,'eur')}</strong><div class="wp-destination" dir="ltr">${h(details)}</div><button class="chip" onclick="cpy(WF.manual.method==='sepa'?WF.manual.receiver.iban:WF.manual.receiver.revtag)">⧉ ${h(wfT('copy'))}</button>${m.method==='revolut'?`<button class="chip" onclick="tg?.openLink(WF.manual.receiver.link)">Revolut ↗</button>`:''}<p>${h(wfT('reference'))}</p><bdi class="wf-reference">${h(m.reference)}</bdi><button class="chip" onclick="cpy(WF.manual.reference)">⧉ ${h(wfT('copy'))}</button><p class="sub">${h(wfT('manualHint'))}</p><button class="gbtn" onclick="wfOpenProof()">${h(wfT('proofLink'))}</button></section>`;
}
const wfBaseShop=wpRenderShop;
wpRenderShop=function(){wfBaseShop();if(TAB==='s'&&WP.mode==='personal'){
 const methods=document.getElementById('wp-methods');if(methods&&WF.manual)methods.insertAdjacentHTML('afterend',wfManualMarkup());
 document.querySelectorAll('.wp-personal .row[data-order-id]').forEach(row=>{const id=Number(row.dataset.orderId),kind=row.dataset.orderKind;const order=WP.catalog?.orders?.find(o=>o.id===id&&(o.kind||'personal')===kind&&o.proof_url);if(order&&!row.querySelector('.wf-proof-history')){const b=document.createElement('button');b.className='chip wf-proof-history';b.textContent=wfT('proofLink');b.onclick=()=>{WF.manual=order.manual;WP.months=order.months;wpRenderShop();requestAnimationFrame(()=>document.querySelector('.wf-customer-transfer')?.scrollIntoView({behavior:'smooth',block:'start'}))};row.appendChild(b)}});
 }};
function wfOpenProof(){if(WF.manual?.proof_url)tg?.openTelegramLink(WF.manual.proof_url)}
const wfBaseChooseCurrency=wpChooseCurrency;
wpChooseCurrency=function(currency){WF.manual=null;return wfBaseChooseCurrency(currency)};
const wfBaseChoosePlan=wpChoosePlan;
wpChoosePlan=function(months){WF.manual=null;return wfBaseChoosePlan(months)};
Object.assign(WP_COPY.fa,{"draft":"منتظر رسید"});Object.assign(WP_COPY.ps,{draft:'رسید ته په تمه'});Object.assign(WP_COPY.en,{draft:'Awaiting receipt'});
async function wfDeepLink(){if(!ME)return;const params=new URLSearchParams(location.search);if(params.get('finance')==='1'&&WF.summary?.allowed)await wfOpen();else if(params.get('personal')==='1'){WP.mode='personal';go('s')}}
// boot() can already be awaiting /api/me when this script loads, so its first
// request may predate our API wrapper. Accept the completed bootstrap as well.
function wfReady(){wfAccept(ME?.finance||{allowed:false});wfDeepLink()}
if(ME)wfReady();else{const timer=setInterval(()=>{if(ME){clearInterval(timer);wfReady()}},200);setTimeout(()=>clearInterval(timer),20000)}
const wfBaseApplyLang=applyLang;
applyLang=function(lang){const result=wfBaseApplyLang(lang);if(WF.summary?.allowed){wfAccept(WF.summary);if(WF.open)wfDraw()}return result};
Object.assign(WF_COPY.fa,{"more":"خریدهای پیش‌تر"});Object.assign(WF_COPY.ps,{more:'پخواني پېرودونه'});Object.assign(WF_COPY.en,{more:'Earlier purchases'});
Object.assign(WF_COPY.fa,{"bad":"معلومات درست نیست."});Object.assign(WF_COPY.ps,{bad:'معلومات سم نه دي.'});Object.assign(WF_COPY.en,{bad:'Invalid details.'});

Object.assign(WF_COPY.fa,{"disable":"غیرفعال‌کدن این روش"});Object.assign(WF_COPY.ps,{disable:'دا لاره بنده کړئ'});Object.assign(WF_COPY.en,{disable:'Disable this method'});

<script>
/* WAKHAN_IDENTITY_UI_V7 */
const WI_COPY={
 fa:{"creator":"سازندهٔ ربات","personal_1":"همراه ویژه","personal_3":"همراه ممتاز","personal_12":"همراه الماس","personal":"همراه واخان پلاس","owner":"مالک گروپ","deputy":"معاون پلیر","admin":"ادمین گروپ","music":"موزیک‌یار واخان","miniapp":"همراه مینی‌اپ","trial":"مهمان ویژه","member":"همراه واخان"},
 ps:{creator:'د ربات جوړوونکی',personal_1:'ځانګړی ملګری',personal_3:'ممتاز ملګری',personal_12:'الماسي ملګری',personal:'د واخان پلس ملګری',owner:'د ګروپ خاوند',deputy:'د پلیر مرستیال',admin:'د ګروپ اډمین',music:'د واخان موسیقي‌یار',miniapp:'د میني‌اپ ملګری',trial:'ځانګړی مېلمه',member:'د واخان ملګری'},
 en:{creator:'Bot Creator',personal_1:'Select Member',personal_3:'Prestige Member',personal_12:'Diamond Member',personal:'Wakhan Plus Member',owner:'Group Owner',deputy:'Player Deputy',admin:'Group Admin',music:'Wakhan DJ',miniapp:'Mini App Member',trial:'Special Guest',member:'Wakhan Member'}
};
const WI_CODES=Object.keys(WI_COPY.en);
const WI={profile:null,context:null,seq:0,request:null,last:0,icon:0,stamp:0,clock:0};
const wiLabel=code=>(WI_COPY[LG]||WI_COPY.fa)[WI_CODES.includes(code)?code:'member'];
function wiContext(){const value=TAB==='g'?SUB?.gid:TAB==='c'?CID:null;return value&&/^-?\d+$/.test(String(value))?String(Math.abs(Number(value))):null}
function wiCurrent(){
 const value=WI.profile||(WI.context===null?ME?.identity:null);
 const primary=value?.primary;
 return primary&&WI_CODES.includes(primary.code)?value:{primary:{code:'member',rank:10,tier:0},secondary:null};
}
function wiIcon(code){
 const id='wi7-'+(++WI.icon),crown=code==='creator'||code==='owner';
 const base=`<defs><linearGradient id="${id}-a" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="var(--wi-light,#dbe9ff)"/><stop offset=".48" stop-color="var(--wi-c1,#71a2ff)"/><stop offset="1" stop-color="var(--wi-c2,#4968c2)"/></linearGradient><linearGradient id="${id}-gold" x2=".8" y2="1"><stop stop-color="#fff5bb"/><stop offset=".48" stop-color="#ffd267"/><stop offset="1" stop-color="#ac661a"/></linearGradient></defs>`;
 let shape='';
 if(crown)shape=`<ellipse cx="32" cy="55" rx="23" ry="4" fill="#000" opacity=".22"/><path d="m8 19 12 12L32 10l12 21 12-12-5 29H13Z" fill="url(#${id}-${code==='creator'?'gold':'a'})" stroke="var(--wi-light)" stroke-width="1.2" stroke-linejoin="round"/><path d="M14 46h36v8H14Z" rx="3" fill="url(#${id}-a)" stroke="var(--wi-light)"/><path d="m32 27 5 8-5 8-5-8Z" fill="${code==='creator'?'#8b53ff':'#e7fff6'}" stroke="#fff5b6"/><circle cx="8" cy="17" r="3" fill="#ffeab0"/><circle cx="32" cy="8" r="3.5" fill="#fff3b6"/><circle cx="56" cy="17" r="3" fill="#ffeab0"/><path d="m16 23 5 5 9-15" fill="none" stroke="#fff7d4" stroke-width="1.4" opacity=".8"/>${code==='creator'?'<path class="wi-spark" d="m56 1 1.7 5.3L63 8l-5.3 1.7L56 15l-1.7-5.3L49 8l5.3-1.7Z" fill="#fff2b1"/>':''}`;
 else if(code==='personal_12')shape=`<ellipse cx="32" cy="55" rx="22" ry="4" fill="#000" opacity=".2"/><path d="m6 23 12-13h28l12 13-26 34Z" fill="url(#${id}-a)" stroke="var(--wi-light)" stroke-width="1.3"/><path d="m6 23 52 0M18 10l4 13 10 34 10-34 4-13M22 23l10-13 10 13" fill="none" stroke="var(--wi-light)" stroke-width="1.3" opacity=".85"/><path class="wi-spark" d="m53 2 1.6 5.4L60 9l-5.4 1.6L53 16l-1.6-5.4L46 9l5.4-1.6Z" fill="#fff6c4"/>`;
 else if(code==='music')shape=`<path d="M10 35v-5a22 22 0 0 1 44 0v5" fill="none" stroke="url(#${id}-a)" stroke-width="8"/><rect x="5" y="30" width="13" height="23" rx="6" fill="url(#${id}-a)" stroke="var(--wi-light)"/><rect x="46" y="30" width="13" height="23" rx="6" fill="url(#${id}-a)" stroke="var(--wi-light)"/><path d="M32 23v21m0-19 11-3v7l-11 3" fill="none" stroke="var(--wi-light)" stroke-width="3"/><ellipse cx="27" cy="46" rx="6" ry="4" fill="var(--wi-light)"/>`;
 else if(code==='miniapp')shape=`<rect x="10" y="6" width="44" height="52" rx="13" fill="url(#${id}-a)" stroke="var(--wi-light)"/><g fill="#fff" opacity=".92"><rect x="20" y="18" width="9" height="9" rx="3"/><rect x="35" y="18" width="9" height="9" rx="3"/><rect x="20" y="33" width="9" height="9" rx="3"/><rect x="35" y="33" width="9" height="9" rx="3"/></g><path d="M26 51h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`;
 else if(code==='trial')shape=`<circle cx="32" cy="32" r="25" fill="url(#${id}-a)" stroke="var(--wi-light)" stroke-width="2"/><circle cx="32" cy="32" r="19" fill="#15263d" opacity=".4"/><path d="M32 18v15l10 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M17 14q8-7 19-5" stroke="#fff" opacity=".7" stroke-width="2" fill="none"/>`;
 else{
  const star=code.startsWith('personal')||code==='deputy'||code==='admin';
  shape=`<path d="M11 11 32 4l21 7v23q-1 16-21 26-20-10-21-26Z" fill="url(#${id}-a)" stroke="var(--wi-light)" stroke-width="1.4"/><path d="m17 15 15-5 15 5v18q0 12-15 21-15-9-15-21Z" fill="#11152f" opacity=".28"/>${star?'<path d="m32 17 4.8 9.6L47 28l-7.5 7.4L41.3 46 32 41l-9.3 5 1.8-10.6L17 28l10.2-1.4Z" fill="#fff0bc" stroke="#fff7e1"/>':'<path d="m20 25 5 16 7-11 7 11 5-16" fill="none" stroke="#eef5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'}`;
 }
 return `<svg class="wi-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${base}${shape}</svg>`;
}
function wiBadge(badge,secondary=false){
 if(!badge||!WI_CODES.includes(badge.code))return '';
 return `<span class="wi-badge wi-${badge.code}${secondary?' wi-secondary':''}" data-rank="${Number(badge.rank)||10}">${wiIcon(badge.code)}<span>${h(wiLabel(badge.code))}</span>${badge.tier?`<i class="wi-tier" aria-hidden="true">${'✦'.repeat(Math.min(3,Math.max(0,badge.tier)))}</i>`:''}</span>`;
}
function wiPersona(compact=false){
 const identity=wiCurrent(),p=identity.primary,m=ME.me,group=p.group||identity.secondary?.group;
 return `<div class="wi-persona wi-${p.code}${compact?' wi-small':''}"><span class="wi-portrait"><img class="hav" src="/ava/${Number(m.id)}" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="hav wi-fallback" hidden>${h(Array.from(m.name||'?')[0])}</span><i class="wi-seal">${wiIcon(p.code)}</i></span><div class="wi-persona-text"><small class="wi-greeting">${h(t('hi'))}</small><div class="wi-name"><bdi>${h(m.name)}</bdi></div><div class="wi-badges">${wiBadge(p)}${wiBadge(identity.secondary,true)}</div>${group?`<small class="wi-group">${h(group.title)}</small>`:''}${!compact?`<div class="hs"><bdi>${ME.un?'@'+h(ME.un)+' · ':''}ID ${Number(m.id)}</bdi></div>`:''}</div></div>`;
}
const wiBaseHero=heroCard;
heroCard=function(){
 const root=document.createElement('template');root.innerHTML=wiBaseHero();
 const hero=root.content.querySelector('.hero'),top=hero?.querySelector('.top');
 if(hero&&top){hero.classList.add('wi-hero','wi-'+wiCurrent().primary.code);top.innerHTML=wiPersona()}
 return root.innerHTML;
};
function wiMount(){
 if(!ME?.me)return;
 const context=wiContext(),changed=context!==WI.context;
 if(changed){WI.context=context;WI.profile=null}
 const view=V();if(!view)return;
 const hero=view.querySelector('.hero');
 const signature=JSON.stringify([wiCurrent(),LG,ME.me.name,ME.un]);
 if(hero){
  view.querySelector('.wi-compact')?.remove();
  if(hero.dataset.wiSignature!==signature){hero.classList.remove(...Array.from(hero.classList).filter(c=>c.startsWith('wi-')));hero.classList.add('wi-hero','wi-'+wiCurrent().primary.code);const top=hero.querySelector('.top');if(top)top.innerHTML=wiPersona();hero.dataset.wiSignature=signature}
 }else{
  let slot=view.querySelector(':scope > .wi-compact');
  if(!slot){slot=document.createElement('div');slot.className='wi-compact';view.prepend(slot)}
  if(slot.dataset.wiSignature!==signature){slot.innerHTML=wiPersona(true);slot.dataset.wiSignature=signature}
 }
 if(changed)wiRefresh();
}
function wiAccept(profile){
 if(!profile?.primary||!WI_CODES.includes(profile.primary.code))return;
 WI.profile=profile;WI.stamp=Number(profile.server_now)||0;WI.clock=performance.now();WI.last=Date.now();wiMount();
}
async function wiRefresh(){
 if(!ME)return;
 const context=wiContext();WI.context=context;
 if(WI.request?.context===context)return WI.request.promise;
 WI.last=Date.now();
 const seq=++WI.seq;

 request.promise=(async()=>{try{const j=await api('/api/identity'+(context?'?g='+encodeURIComponent(context):''));if(seq===WI.seq&&j.ok){WI.last=Date.now();wiAccept(j.identity)}}catch(e){}finally{if(WI.request===request)WI.request=null}})();

 CB.busy=true;cbRender();
 try{const j=await api('/api/checkout/prepare',selected);if(j.ok)CB.bill=j;else CB.error=cbT(j.err)}catch(e){CB.error=cbT('err')}

 const kind=CB.kind,months=CB.months;

  const body={kind,months,cid:kind==='group'?-Math.abs(Number(CB.gid)):0,lang:LG,client_key:CB.key,terms:'2026-11-03'};
  const j=await api(kind==='group'?'/api/checkout/stars':'/api/personal/stars',body);

  tg.openInvoice(j.url,async status=>{
   if(status!=='paid'&&status!=='pending'){toast(wpT('starsCancelled'));return}
   toast(cbT('pending'));
   for(let i=0;i<5;i++){
    const paid=await api('/api/checkout/status?kind='+(kind==='group'?'group':'personal_stars')+'&id='+j.id);

async function af24Request(body){const j=await api('/api/frames',body);if(!j.ok)throw Error(j.err||'err');return j}

async function af24MintQuote(){
 AF24.target=wpDigits(document.getElementById('af24-target')?.value||'');AF24.amount=wpDigits(document.getElementById('af24-amount')?.value||'');AF24.reason=document.getElementById('af24-reason')?.value||'';
 await af24Run(async seq=>{const j=await af24Request({action:'mint_quote',uid:Number(AF24.target),coins:AF24.amount,reason:AF24.reason});if(seq!==AF24.seq)return;AF24.quote=j;AF24.key=wc23Key()});
}
async function af24Mint(){const quote=AF24.quote,key=AF24.key;if(!quote?.token||!key)return;await af24Run(async seq=>{const j=await af24Request({action:'mint',token:quote.token,client_key:key});await af24Refresh(false);await wc23Refresh(false);if(seq!==AF24.seq)return;AF24.done=j;AF24.quote=null})}

setBack=function(){af24Back();if(AF24.open)try{tg?.BackButton?.show()}catch(e){}};

wc23History=function(){
 const markup=af24History();if(!WC23.data)return markup;const template=document.createElement('template');template.innerHTML=markup;

 return template.innerHTML;
};

 if(['staff_only','auth'].includes(j?.err)){OP31.denied=true;OP31.data=OP31.group=OP31.member=null;OP31.selected=0;op31SyncNav()}
}
async function op31Load(append=false){
 if(!op31Allowed())return;const seq=++OP31.seq;OP31.loading=true;OP31.error='';if(TAB==='o')op31Render();
 try{const j=await api('/api/operations?q='+encodeURIComponent(OP31.q)+'&status='+OP31.filter+'&page='+OP31.page);if(seq!==OP31.seq)return;if(!j.ok){op31Error(j);return}OP31.data=append&&OP31.data?{...j,groups:[...OP31.data.groups,...j.groups]}:j}
 catch(e){if(seq===OP31.seq)OP31.error=op31T('error')}
 finally{if(seq===OP31.seq){OP31.loading=false;if(TAB==='o')op31Render();op31UpdateGuide()}}
}
async function op31LoadGroup(cid=OP31.selected){
 if(!cid||!op31Allowed())return;const seq=++OP31.seq;OP31.selected=Number(cid);OP31.loading=true;OP31.error='';if(TAB==='o')op31Render();
 try{const j=await api('/api/operations?cid='+encodeURIComponent(cid));if(seq!==OP31.seq||OP31.selected!==Number(cid))return;if(!j.ok){op31Error(j);return}OP31.group=j.group;OP31.groupAudit=j.audit;OP31.member=null;OP31.target=''}
 catch(e){if(seq===OP31.seq)OP31.error=op31T('error')}
 finally{if(seq===OP31.seq){OP31.loading=false;if(TAB==='o')op31Render();op31UpdateGuide()}}
}
function op31Select(cid){if(OP31.busy)return;OP31.group=null;OP31.member=null;OP31.selected=Number(cid);op31LoadGroup(Number(cid));window.scrollTo({top:0})}
function op31Back(){if(OP31.busy)return;++OP31.seq;OP31.loading=false;OP31.selected=0;OP31.group=OP31.member=null;op31Render();op31Load()}
let op31SearchTimer;
function op31Search(value){OP31.q=value;clearTimeout(op31SearchTimer);op31SearchTimer=setTimeout(()=>{OP31.page=0;op31Load()},300)}
function op31Filter(value){OP31.filter=value;OP31.page=0;op31Load()}
function op31Tab(tab){if(OP31.busy)return;OP31.tab=tab;OP31.error='';op31Render();if(tab==='audit')op31LoadAudit()}
function op31More(){if(OP31.loading)return;OP31.page++;op31Load(true)}
async function op31LoadAudit(){
 if(!op31Allowed())return;const seq=(OP31.auditSeq||0)+1;OP31.auditSeq=seq;
 try{const j=await api('/api/operations?logs=1&page='+OP31.auditPage);if(seq!==OP31.auditSeq)return;if(!j.ok){op31Error(j);return}OP31.audit=j.audit;OP31.auditMore=j.audit_more;if(TAB==='o'&&OP31.tab==='audit')op31Render()}catch(e){OP31.error=op31T('error');if(TAB==='o')op31Render()}
}
async function op31Lookup(team=false){
 if(OP31.busy)return;const target=String(team?OP31.teamTarget:OP31.target).trim();if(!target)return;
 const cid=team?0:OP31.selected;OP31.busy=true;OP31.error='';if(team)OP31.teamUser=null;else OP31.member=null;op31Render();
 try{const j=await api('/api/operations',{action:'lookup',cid,target});if(!j.ok){op31Error(j);return}if(cid!==OP31.selected&&!team)return;if(team)OP31.teamUser=j.user;else OP31.member=j.user}
 catch(e){OP31.error=op31T('error')}
 finally{OP31.busy=false;if(TAB==='o')op31Render()}
}
async function op31Act(action,extra={}){
 if(OP31.busy||!op31Allowed())return;
 const team=action.startsWith('team_'),cid=team?0:OP31.selected;if(!team&&(!OP31.group||OP31.group.id!==cid))return;
 const body={action,cid,...extra};if(!team)body.expected_rev=OP31.group.rev;
 if(action==='credit'){const days=Number(w29Latin(OP31.days));if(!Number.isInteger(days)||days<1||days>36500){OP31.error=op31T('bad_days');op31Render();return}body.days=days}
 if(action==='team_add')body.target=OP31.teamTarget.trim();
 const identity=JSON.stringify({...body,expected_rev:undefined});
 if(OP31.intent?.identity===identity)Object.assign(body,OP31.intent.body);else{body.client_key=op31Key();OP31.intent={identity,body:{...body}}}
 OP31.busy=true;OP31.error='';op31Render();op31UpdateGuide();
 try{
  const j=await api('/api/operations',body);
  if(!j.ok){if(j.err!=='server')OP31.intent=null;op31Error(j);if(j.err==='stale_group'){await op31LoadGroup(cid);OP31.error=op31T('stale_group')}return}
  OP31.intent=null;toast(j.stop_ok===false?op31T('stop_failed'):op31T(action+'_done')===action+'_done'?op31T('done'):op31T(action+'_done').replace('{days}',String(j.days||'')));
  if(team){OP31.teamUser=null;OP31.teamTarget='';await af24Refresh(false);await op31Load()}
  else {const previousTarget=OP31.member?.id;await op31LoadGroup(cid);if(action==='right'&&previousTarget){const next=await api('/api/operations',{action:'lookup',cid,target:String(previousTarget)});if(next.ok)OP31.member=next.user}}
 }catch(e){OP31.error=op31T('error')}
 finally{OP31.busy=false;if(TAB==='o')op31Render();op31UpdateGuide()}
}
function op31Person(user){return `<span class="op31-person"><img src="/ava/${Number(user.id)}" alt="" loading="lazy" onerror="this.hidden=true"><span><b dir="auto">${h(user.name||String(user.id))}</b><small><bdi>${user.id}</bdi>${user.username?' · @'+h(user.username):''}</small></span></span>`}
function op31State(g){return g.suspended?'suspended':!g.approved?'pending':g.active===false||g.until<=Date.now()/1000?'expired':'active'}
function op31GrantControls(){
 const u=OP31.member;if(!u)return '';
 const fixed=['owner','creator'].includes(u.role);
 return `<div class="op31-result">${op31Person(u)}<small>${h(op31T('direct'))}</small>${fixed?`<p>${h(op31T('fixed_role'))}</p>`:`<div class="op31-rights">${['music','miniapp','deputy','minister'].map(right=>`<button type="button" role="switch" aria-checked="${u.rights[right]}" class="${u.rights[right]?'on':''}" onclick="op31Act('right',{target:'${u.id}',right:'${right}',enabled:${!u.rights[right]}})">${op31Icon(right==='music'?'credit':'shield')}<span>${h(op31T(right))}</span><i aria-hidden="true"></i></button>`).join('')}</div>`}</div>`;
}
function op31GrantList(){
 const groups=new Map();for(const grant of OP31.group?.grants||[]){let item=groups.get(grant.user.id);if(!item){item={...grant.user,fixed:grant.fixed,rights:[]};groups.set(item.id,item)}item.rights.push(grant.right)}
 return `<details class="op31-grant-list"><summary>${h(op31T('grant_list'))} · ${groups.size}</summary>${Array.from(groups.values()).map(u=>`<article class="op31-team-member">${op31Person(u)}<small>${h(u.rights.map(op31T).join(' · '))}</small><div class="op31-actions">${op31Button(op31T('member'),`OP31.target='${u.id}';op31Lookup()`,'shield')}${!u.fixed?op31Button(op31T('revoke'),`op31Act('revoke',{target:'${u.id}'})`,'stop','class="op31-remove"'):''}</div></article>`).join('')||`<p>${h(op31T('empty'))}</p>`}</details>`;
}
function op31GroupView(){
 const g=OP31.group;if(!g)return `<div class="op31-card skel" style="height:240px"></div>`;
 return `${op31Button(op31T('back'),'op31Back()','groups','class="op31-back"')}<section class="op31-card"><div class="op31-group-title">${op31Icon('groups')}<div><h2 dir="auto">${h(g.title)}</h2><button class="op31-copy" onclick="cpy('${g.id}')"><bdi>${g.id}</bdi><span>${h(op31T('copy'))}</span></button></div><span class="op31-status ${op31State(g)}">${h(op31T(op31State(g)))}</span></div><div class="op31-credit-value"><bdi>${g.days}</bdi><span>${h(op31T('days'))} · ${h(op31T('remaining'))}</span></div><small>${h(op31T('until'))}: <bdi>${h(op31Time(g.until))}</bdi></small></section>
 <section class="op31-card"><h3>${op31Icon('owner')}${h(op31T('owner'))}</h3>${op31Person(g.owner)}<p>${h(op31T(!g.owner_current?'owner_transfer':g.owner_enabled?'owner_role':'owner_pending'))}</p>${op31Button(op31T('set_owner'),"op31Act('owner')",'owner','class="op31-primary"')}</section>
 <section class="op31-card"><h3>${op31Icon('credit')}${h(op31T('credit'))}</h3><p>${h(op31T('credit_hint'))}</p><div class="op31-presets">${[3,7,30,90,300].map(days=>`<button type="button" class="${Number(OP31.days)===days?'on':''}" onclick="OP31.days='${days}';op31Render()"><bdi>${days}</bdi></button>`).join('')}</div><label class="op31-days">${h(op31T('days'))}<input id="op31-days" inputmode="numeric" value="${h(OP31.days)}" oninput="OP31.days=this.value;document.getElementById('op31-add-label').textContent=op31T('add_credit').replace('{days}',w29Latin(this.value))"></label><button type="button" class="op31-primary" onclick="op31Act('credit')">${op31Icon('credit')}<span id="op31-add-label">${h(op31T('add_credit').replace('{days}',OP31.days))}</span></button>${!g.approved&&g.until>Date.now()/1000?op31Button(op31T('approve'),"op31Act('approve')",'shield'):''}</section>
 <section class="op31-card"><h3>${op31Icon('shield')}${h(op31T('member'))}</h3><p>${h(op31T('deputy_note'))}</p><label>${h(op31T('target'))}<input id="op31-member-target" type="text" dir="ltr" value="${h(OP31.target)}" oninput="OP31.target=this.value" placeholder="123456789 / @username"></label>${op31Button(op31T('lookup'),'op31Lookup()','search')}${op31GrantControls()}${op31GrantList()}</section>
 <section class="op31-card"><p>${h(op31T('pause_note'))}</p><div class="op31-actions">${op31Button(op31T(g.suspended?'resume':'suspend'),`op31Act('${g.suspended?'resume':'suspend'}')`,'shield')}${g.playback.title?op31Button(op31T('stop'),"op31Act('stop')",'stop','class="op31-danger"'):''}</div><p dir="auto">${h(g.playback.title||op31T('no_playback'))}</p><small>${h(op31T('queue'))}: <bdi>${g.playback.queue}</bdi></small></section>
 <section class="op31-card"><h3>${op31Icon('audit')}${h(op31T('audit'))}</h3>${op31LogView(OP31.groupAudit||[])}</section>`;
}
function op31TeamView(){
 const root=(AF24.data?.role||OP31.data?.role)==='creator';
 return `<section class="op31-card"><h3>${op31Icon('team')}${h(op31T('team'))}</h3><p>${h(op31T('team_note'))}</p>${root?`<label>${h(op31T('target'))}<input id="op31-team-target" type="text" dir="ltr" value="${h(OP31.teamTarget)}" oninput="OP31.teamTarget=this.value;OP31.teamUser=null" placeholder="123456789 / @username"></label><div class="op31-actions">${op31Button(op31T('lookup'),'op31Lookup(true)','search')}${op31Button(op31T('team_add'),"op31Act('team_add')",'team','class="op31-primary"')}</div>${OP31.teamUser?op31Person(OP31.teamUser):''}`:''}${OP31.data?.team?.length?OP31.data.team.map(u=>`<article class="op31-team-member">${op31Person(u)}${!u.known?`<small>${h(op31T('pending_start'))}</small>`:''}${root?op31Button(op31T('team_remove'),`op31Act('team_remove',{target:'${u.id}'})`,'stop','class="op31-remove"'):''}</article>`).join(''):`<p>${h(op31T('empty'))}</p>`}</section>${root?`<section class="op31-card">${op31Button(op31T('mint'),'op31Mint()','credit')}</section>`:''}`;
}
function op31Mint(){af24Open().then(()=>af24Tab('mint'))}
function op31LogView(rows){
 if(!rows.length)return `<p>${h(op31T('empty'))}</p>`;
 return rows.map(row=>{const key=row.action==='right'?'member':row.action==='owner_changed'?'owner_transfer':row.action.startsWith('grant:')||row.action.startsWith('revoke:')?'member':row.action;
 const extra=row.detail?.days?` · ${row.detail.days} ${op31T('days')}`:row.detail?.right?' · '+op31T(row.detail.right):'';
 return `<article class="op31-log"><span>${op31Icon('audit')}</span><div><b>${h(op31T(key)===key?op31T('done'):op31T(key))}${h(extra)}</b><small>${h(row.actor.name)}${row.target?' ← '+h(row.target.name):''}</small>${row.cid?`<small><bdi>${row.cid}</bdi></small>`:''}<time>${h(op31Date(row.ts))}</time></div></article>`}).join('');
}
function op31ListView(){
 const data=OP31.data;
 return `<section class="op31-card"><label class="op31-search">${op31Icon('search')}<input id="op31-search" type="search" placeholder="${h(op31T('search'))}" value="${h(OP31.q)}" oninput="op31Search(this.value)"></label><div class="op31-filters">${['all','active','pending','near','expired','suspended'].map(key=>`<button type="button" class="${OP31.filter===key?'on':''}" onclick="op31Filter('${key}')">${h(op31T(key))}</button>`).join('')}</div></section><div class="op31-group-list">${data?.groups?.length?data.groups.map(g=>`<button type="button" class="op31-group" onclick="op31Select(${g.id})">${op31Icon('groups')}<span><b dir="auto">${h(g.title)}</b><small><bdi>${g.id}</bdi> · ${g.days} ${h(op31T('days'))}</small></span><span class="op31-status ${g.state}">${h(op31T(g.state))}</span></button>`).join(''):`<p class="op31-card">${h(op31T('empty'))}</p>`}</div>${data?.more?op31Button(op31T('more'),'op31More()','groups'):''}<section class="op31-card">${op31Button(op31T('bot_add'),'addBotLink()','team')}<small>${h(op31T('add_hint'))}</small></section>`;
